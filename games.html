<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games — WetShore Studios</title>
  <link rel="icon" href="assets/wetshore-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="games">
  <div id="site-nav"></div>
  <main>
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow">WetShore Studios</p>
        <h1>Games</h1>
        <p>Everything we're building. Pick a game to see trailers, news and how to get involved.</p>
      </div>
    </section>
    <section class="section container page-first">
      <div class="games-grid page" data-render="games"></div>
    </section>
    <section class="cta">
      <div class="container cta-inner reveal">
        <div>
          <p class="eyebrow">Community</p>
          <h2>Hear about new games first</h2>
          <p>Announcements, playtests and dev updates land in our Discord before anywhere else.</p>
        </div>
        <a class="pill big" data-discord>Join the Discord</a>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="script.js"></script>
</body>
</html>
